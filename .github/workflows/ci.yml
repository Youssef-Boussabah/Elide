name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: elide
          POSTGRES_USER: elide
          POSTGRES_PASSWORD: elide_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elide -d elide"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://elide:elide_ci_only@localhost:5432/elide
      ELIDE_TEST_DATABASE_URL: postgresql+psycopg://elide:elide_ci_only@localhost:5432/elide
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
