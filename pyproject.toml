[project]
name = "elide"
version = "0.0.1"
description = "Elide: permissioned, network-aware invoice payment and liquidity coordination (PayPal AI Hackathon)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
# The backend is run from the repository root (`api` is the import package);
# it is not built or published as a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs local PostgreSQL (docker compose up -d db); skipped if unreachable",
    "sandbox: calls the real PayPal Sandbox; never runs by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
